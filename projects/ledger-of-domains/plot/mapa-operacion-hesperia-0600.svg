<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="100%" font-family="Arial, Helvetica, sans-serif">
<title>Isla del Coco, 18 de julio, 06:00</title>
<desc>Mapa de las posiciones a las 06:00: la Uno regrupada en la ladera, Valais en marcha, Belcebú, Daniel y Kaspar en la cámara, Ji-ho esperando en el acantilado.</desc>
