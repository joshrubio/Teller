<rect x="738" y="310" width="154" height="44" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/><text x="746" y="327" font-size="12" font-weight="bold" fill="#0C447C">ER-4</text><text x="746" y="341" font-size="11" fill="#185FA5">sube al acantilado</text>
<rect x="738" y="365" width="154" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="746" y="382" font-size="12" font-weight="bold" fill="#085041">ER-7</text><text x="746" y="396" font-size="11" fill="#0F6E56">navega al muelle norte,</text><text x="746" y="408" font-size="11" fill="#0F6E56">frente a la costa este</text>
<polyline points="450,512 450,486 436,424 432,414" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/><circle cx="450" cy="522" r="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.5"/><text x="468" y="520" font-size="12" font-weight="bold" fill="#085041">ER-5, ER-6 y Valais</text><text x="468" y="536" font-size="11" fill="#0F6E56">arrancan hacia la hondonada</text>
<circle cx="200" cy="610" r="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.5"/><text x="218" y="608" font-size="12" font-weight="bold" fill="#085041">Barco de mando, 12 millas</text><text x="218" y="624" font-size="11" fill="#0F6E56">Taeho, con la radio</text><text x="16" y="704" font-size="11" fill="#5F5E5A">Azul, AMAT. Morado, Hesperia y los Jinetes. Verde, refuerzos y Ji-ho. Línea verde, marcha de Valais.</text>
