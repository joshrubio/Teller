<g font-size="12">
<rect x="8" y="238" width="162" height="44" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="16" y="256" font-weight="bold" fill="#0C447C">ER-3</text><text x="16" y="272" font-size="11" fill="#185FA5">flanco oeste</text>
<rect x="8" y="185" width="162" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
