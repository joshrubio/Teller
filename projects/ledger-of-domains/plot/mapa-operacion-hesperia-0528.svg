<rect x="738" y="185" width="154" height="50" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="746" y="203" font-weight="bold" fill="#3C3489">Bajo la grieta</text><text x="746" y="218" font-size="11" fill="#534AB7">Kaspar, Sisi, Tomás,</text><text x="746" y="230" font-size="11" fill="#534AB7">Anaís, Ladón, zarza</text>
<rect x="738" y="245" width="154" height="40" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.8"/>
<text x="746" y="262" font-weight="bold" fill="#791F1F">Belcebú</text><text x="746" y="277" font-size="11" fill="#A32D2D">baja del acantilado este</text>
<rect x="738" y="300" width="154" height="44" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="746" y="318" font-weight="bold" fill="#0C447C">Conti, Calloway,</text><text x="746" y="334" font-weight="bold" fill="#0C447C">Solheim</text>
<rect x="738" y="390" width="154" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="746" y="407" font-weight="bold" fill="#0C447C">ER-4</text><text x="746" y="422" font-size="11" fill="#185FA5">costa este</text>
</g>

<g font-size="12">
<text x="468" y="556" font-weight="bold" fill="#085041">ER-5 y ER-6, desembarcan 05:30</text>
<text x="468" y="572" font-size="11" fill="#0F6E56">Oliver, Voss, Riku, Pier, Dara, Asha, Nadia, Lev, Sabine</text>
<text x="218" y="636" font-weight="bold" fill="#085041">Barco de mando, 12 millas</text>
<text x="218" y="652" font-size="11" fill="#0F6E56">Ji-ho y Taeho</text>
<text x="658" y="646" font-weight="bold" fill="#085041">ER-7, reserva</text>
<text x="658" y="662" font-size="11" fill="#0F6E56">15 millas al sur</text>
</g>
<text x="16" y="696" font-size="11" fill="#5F5E5A">Azul, AMAT en la isla. Rojo, Belcebú. Morado, Hesperia. Verde, refuerzos. Línea azul, ruta de la Uno. Línea roja, ruta de Belcebú. Punteado verde, helicóptero de Ji-ho.</text>
