<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="100%" font-family="Arial, Helvetica, sans-serif">
<title>Mapa de la operación Hesperia, 18 de julio, 05:28</title>
<desc>Isla del Coco con la cuenca de Hesperia, la cresta sur y su paso, las rutas de la Uno, de Belcebú y de los refuerzos, y cada grupo rotulado en su posición a las 05:28.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="900" height="710" fill="#FFFFFF"/>
<text x="16" y="26" font-size="15" font-weight="bold" fill="#2C2C2A">Isla del Coco, 18 de julio, 05:28</text>
<text x="16" y="44" font-size="12" fill="#5F5E5A">Norte arriba. La playa y el paso están al sur. El muelle de Hesperia, al norte.</text>

<ellipse cx="450" cy="320" rx="280" ry="180" fill="#F7F6F1" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/>
<text x="450" y="163" font-size="11" fill="#5F5E5A" text-anchor="middle">muelle norte (Meridiana)</text>
<ellipse cx="450" cy="250" rx="120" ry="60" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="450" y="226" font-size="12" font-weight="bold" fill="#3C3489" text-anchor="middle">Hesperia</text>
<text x="450" y="242" font-size="11" fill="#3C3489" text-anchor="middle">3.100 civiles a oscuras</text>
<path d="M 300 300 C 350 360, 430 372, 442 362" fill="none" stroke="#5F5E5A" stroke-width="2.5"/>
<path d="M 458 362 C 470 372, 550 360, 600 300" fill="none" stroke="#5F5E5A" stroke-width="2.5"/>
<text x="450" y="382" font-size="11" fill="#5F5E5A" text-anchor="middle">paso</text>
<text x="590" y="372" font-size="11" fill="#5F5E5A">cresta sur</text>
<ellipse cx="430" cy="406" rx="40" ry="12" fill="none" stroke="#639922" stroke-width="1" stroke-dasharray="3 3"/>
<text x="488" y="500" font-size="11" fill="#5F5E5A">playa sur</text>

<polyline points="450,470 436,420 430,408 450,362 450,318" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<polyline points="690,262 568,312 508,338 455,284" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<line x1="450" y1="548" x2="450" y2="505" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#a)"/>
<polyline points="206,632 300,520 408,362" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#a)"/>

