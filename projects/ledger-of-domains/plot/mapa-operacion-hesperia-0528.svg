<text x="16" y="308" font-weight="bold" fill="#0C447C">Haddad, Kino, Briggs</text><text x="16" y="324" font-size="11" fill="#185FA5">línea izquierda de ER-2</text>
<rect x="8" y="345" width="162" height="44" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
